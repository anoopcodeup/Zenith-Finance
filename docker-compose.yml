version: '3.8'

services:
  # 1. Local Database (PostgreSQL) - Used for local runs
  postgres:
    image: postgres:16-alpine
    container_name: zenith-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: zenith_local
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - zenith-network

  # 2. Local Cache & Queue (Redis)
  redis:
    image: redis:7-alpine
    container_name: zenith-redis
    ports:
      - "6379:6379"
    networks:
      - zenith-network

  # 3. Backend REST Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zenith-backend
    ports:
      - "5000:5000"
    environment:
      # If you want to connect to AWS RDS instead of the local postgres container,
      # replace "postgres" with your RDS endpoint in your root .env file.
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password123@postgres:5432/zenith_local?schema=public}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-supersecretkey}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-supersecretkey}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-1h}
      - INTERNAL_API_TOKEN=${INTERNAL_API_TOKEN:-internalapikey}
    depends_on:
      - postgres
      - redis
    networks:
      - zenith-network

  # 4. Frontend Next.js Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zenith-frontend
    ports:
      - "3000:3000"
    environment:
      # Within the docker-compose network, the frontend communicates with the backend
      # directly using the service name "backend"
      - BACKEND_API_URL=${BACKEND_API_URL:-http://backend:5000}
    depends_on:
      - backend
    networks:
      - zenith-network

volumes:
  postgres_data:

networks:
  zenith-network:
    driver: bridge
